name: Redirect header security regression

on:
  push:
    branches:
      - fix/cross-origin-redirect-header-leak
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redirect-header-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run redirect header security tests
        env:
          ALLOW_IANA_RESTRICTED_ADDRESSES: "true"
        run: |
          pytest -q changedetectionio/tests/test_redirect_header_security.py
